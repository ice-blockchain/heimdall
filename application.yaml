development: true
logger:
  encoder: console
  level: debug
cmd/heimdall-identity-io:
  host: localhost:8001
  version: local
  api-key:
   - bogus
   - bogus2
  requiredAppVersions:
    android: 9.9.9
    ios: 9.9.9
  assetLinks: '[]'
  appleAppSiteAssociation: '{
  "applinks": {
    "apps": [],
    "details": [
      {
        "appID": "bogus",
        "paths": [
          "*"
        ]
      }
    ]
  },
  "webcredentials": {
    "apps": [
      "bogus"
    ]
  }
}'
  defaultEndpointTimeout: 60s
  httpServer:
    port: 8001
    certPath: cmd/heimdall-identity-io/.testdata/localhost.crt
    keyPath: cmd/heimdall-identity-io/.testdata/localhost.key

cmd/heimdall-asset-data-syncer:
  version: local
  defaultEndpointTimeout: 60s
  httpServer:
    port: 8888
    certPath: cmd/heimdall-identity-io/.testdata/localhost.crt
    keyPath: cmd/heimdall-identity-io/.testdata/localhost.key

accounts:
  delegated_relying_party:
    auth:
      issuer: auth.dfns.ninja
    refreshToken:
      secret: bogus
      issuer: ION/local
      expirationTime: 24h
    ton:
      global-config-url: https://ton-blockchain.github.io/testnet-global.config.json
    ion:
      global-config-url: https://ton-blockchain.github.io/testnet-global.config.json
    testnet: true
    allowedApplications:
      ap-bogus:
        name: Bogus
        origin: https://bogus.com
        rpId: bogus.com
    #baseUrl: https://bogus.example
    #webhookUrl:
    #appId: bogus
    #webFEAppId: bogus
    #serviceKey: bogus-key
    #credentialPrivateKey: bogus
    #credentialId: bogus
  fromEmailAddress: no-reply@ice.io
  fromEmailName: ice
  wintr/email:
    credentials:
      #apiKey: bogus
  wintr/sms:
    credentials:
      #user: bogus
      #password: bogus
  wintr/totp:
    issuer: ION
  emailExpiration: 15m
  smsExpiration: 15m
  userSignatureExpiration: 1h
  max2FACount: 2
  mockRelays:
    - wss://relay.nostr.band/
    - wss://relay1.nostr.band/
    - wss://relay3.nostr.band/

  wintr/connectors/storage/v2:
    runDDL: true
    primaryURL: postgresql://root:pass@localhost:5437/heimdall
    credentials:
      user: root
      password: pass
    replicaURLs:
      - postgresql://root:pass@localhost:5437/heimdall
coins:
  defaultSyncFrequency: 12h
  syncTokensDataFrequency: 24h
  syncFrequency:
    the-open-network: 10s
  fees:
    ton:
      slow:
        maxPriorityFee: 225000003
        maxFee: 225000091
        waitTime: 100000
      standard:
        maxPriorityFee: 225000003
        maxFee: 225000091
        waitTime: 100000
    bsc:
      slow:
        maxPriorityFee: 225000003
        maxFee: 225000091
        waitTime: 100000
      fast:
        maxPriorityFee: 225000003
        maxFee: 225000091
        waitTime: 1000
  coin-gecko:
    #api-key: bogus
    base-url: https://pro-api.coingecko.com
  wintr/connectors/storage/v2:
    runDDL: true
    primaryURL: postgresql://root:pass@localhost:5437/heimdall
    credentials:
      user: root
      password: pass
    replicaURLs:
      - postgresql://root:pass@localhost:5437/heimdall
nfts:
  coin-gecko:
    #api-key: bogus
    base-url: https://pro-api.coingecko.com