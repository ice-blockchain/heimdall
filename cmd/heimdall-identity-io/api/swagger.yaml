definitions:
  accounts.CoinAggregation:
    properties:
      totalBalance:
        $ref: '#/definitions/big.Int'
      wallets:
        items:
          $ref: '#/definitions/accounts.CoinInWallet'
        type: array
    type: object
  accounts.CoinInWallet:
    properties:
      asset:
        $ref: '#/definitions/dfns.Asset'
      coinId:
        type: string
      network:
        type: string
      walletId:
        type: string
    type: object
  accounts.CoinMapping:
    properties:
      coinId:
        type: string
      walletId:
        type: string
    type: object
  accounts.LiteUser:
    properties:
      ionConnectRelays:
        items:
          type: string
        type: array
      masterPubKey:
        type: string
    type: object
  accounts.NFT:
    properties:
      collectionImageUri:
        type: string
      description:
        type: string
      name:
        type: string
      network:
        type: string
      walletId:
        type: string
    type: object
  accounts.SocialProfile:
    properties:
      displayName:
        type: string
      referral:
        type: string
      username:
        type: string
      usernameProof:
        items:
          $ref: '#/definitions/model.Event'
        type: array
    type: object
  accounts.TwoFAOptionEnum:
    enum:
    - sms
    - email
    - totp_authenticator
    type: string
    x-enum-varnames:
    - TwoFAOptionSMS
    - TwoFAOptionEmail
    - TwoFAOptionTOTPAuthenticator
  big.Int:
    type: object
  coins.Coin:
    properties:
      contractAddress:
        type: string
      decimals:
        type: integer
      iconURL:
        type: string
      id:
        type: string
      name:
        type: string
      native:
        type: boolean
      network:
        type: string
      priceUSD:
        type: number
      prioritized:
        type: boolean
      symbol:
        type: string
      symbolGroup:
        type: string
      syncFrequency:
        $ref: '#/definitions/time.Duration'
      version:
        type: integer
    type: object
  coins.NFT:
    properties:
      collectionImageUri:
        type: string
      description:
        type: string
      name:
        type: string
      network:
        type: string
      walletId:
        type: string
    type: object
  dfns.Asset:
    additionalProperties: {}
    type: object
  main.Coin:
    properties:
      contractAddress:
        type: string
      decimals:
        type: integer
      iconURL:
        type: string
      id:
        type: string
      name:
        type: string
      native:
        type: boolean
      network:
        type: string
      priceUSD:
        type: number
      prioritized:
        type: boolean
      symbol:
        type: string
      symbolGroup:
        type: string
      syncFrequency:
        $ref: '#/definitions/time.Duration'
      version:
        type: integer
    type: object
  main.CreateWalletReq:
    properties:
      network:
        type: string
      walletViewId:
        type: string
    type: object
  main.GetContentCreatorsReq:
    properties:
      excludeMasterPubKeys:
        items:
          type: string
        type: array
    type: object
  main.GetLoginChallenge:
    properties:
      2FAVerificationCodes:
        additionalProperties:
          type: string
        type: object
      username:
        type: string
    type: object
  main.HashtagsEventsReq:
    properties:
      events:
        items:
          $ref: '#/definitions/model.Event'
        minItems: 1
        type: array
    required:
    - events
    type: object
  main.ImportCoinReq:
    properties:
      contractAddress:
        type: string
      network:
        type: string
    type: object
  main.LiteUser:
    properties:
      ionConnectRelays:
        items:
          type: string
        type: array
      masterPubKey:
        type: string
    type: object
  main.LoginChallenge:
    additionalProperties: {}
    type: object
  main.NFTCollection:
    properties:
      network:
        type: string
      nfts:
        items:
          $ref: '#/definitions/coins.NFT'
        type: array
      walletId:
        type: string
    type: object
  main.Network:
    properties:
      displayName:
        type: string
      explorerUrl:
        type: string
      id:
        type: string
      image:
        type: string
      isTestnet:
        type: boolean
      tier:
        type: integer
    type: object
  main.Relays:
    properties:
      ionConnectRelays:
        items:
          type: string
        type: array
    type: object
  main.RelaysReq:
    properties:
      followeeList:
        items:
          type: string
        type: array
    type: object
  main.Send2FARequestReq:
    properties:
      2FAVerificationCodes:
        additionalProperties:
          type: string
        type: object
      email:
        type: string
      phoneNumber:
        type: string
      replace:
        type: string
    type: object
  main.Send2FARequestResp:
    properties:
      TOTPAuthenticatorURL:
        type: string
    type: object
  main.StartDelegatedRecoveryReq:
    properties:
      2FAVerificationCodes:
        additionalProperties:
          type: string
        type: object
      credentialId:
        type: string
      username:
        type: string
    type: object
  main.StartDelegatedRecoveryResp:
    additionalProperties: {}
    type: object
  main.SymbolGroupWithCoins:
    properties:
      coins:
        items:
          $ref: '#/definitions/coins.Coin'
        type: array
      symbol_group:
        type: string
    type: object
  main.UpsertSocialProfileRequest:
    properties:
      displayName:
        type: string
      referral:
        type: string
      username:
        type: string
    type: object
  main.User:
    properties:
      2faOptions:
        items:
          $ref: '#/definitions/accounts.TwoFAOptionEnum'
        type: array
      email:
        items:
          type: string
        type: array
      ionConnectIndexerRelays:
        items:
          type: string
        type: array
      ionConnectRelays:
        items:
          type: string
        type: array
      masterPubKey:
        type: string
      phoneNumber:
        items:
          type: string
        type: array
    type: object
  main.VerifiedBadgeEvents:
    properties:
      events:
        items:
          $ref: '#/definitions/model.Event'
        type: array
    type: object
  main.Verify2FARequestResp:
    type: object
  main.VersionedCoins:
    properties:
      coins:
        items:
          $ref: '#/definitions/coins.Coin'
        type: array
      networks:
        items:
          $ref: '#/definitions/main.Network'
        type: array
      version:
        type: integer
    type: object
  main.Wallet:
    additionalProperties: {}
    type: object
  main.WalletView:
    properties:
      aggregation:
        additionalProperties:
          $ref: '#/definitions/accounts.CoinAggregation'
        description: For GetWalletView, with total sum by symbol aggregation
        type: object
      coins:
        items:
          $ref: '#/definitions/accounts.CoinMapping'
        type: array
      createdAt:
        type: string
      id:
        type: string
      name:
        type: string
      nfts:
        description: For GetWalletView, all nfts from connected wallets
        items:
          $ref: '#/definitions/accounts.NFT'
        type: array
      symbolGroups:
        items:
          type: string
        type: array
      updatedAt:
        type: string
      userId:
        type: string
    type: object
  main.WalletViewReq:
    properties:
      items:
        items:
          $ref: '#/definitions/accounts.CoinMapping'
        type: array
      name:
        type: string
      symbolGroups:
        items:
          type: string
        type: array
    type: object
  main.delegatedErrorResponse:
    properties:
      data:
        additionalProperties: {}
        type: object
      error:
        $ref: '#/definitions/main.errMessage'
    type: object
  main.errMessage:
    properties:
      message:
        type: string
    type: object
  model.Event:
    properties:
      content:
        type: string
      createdAt:
        type: integer
      id:
        type: string
      kind:
        type: integer
      pubKey:
        type: string
      sig:
        type: string
      tags:
        items:
          items:
            type: string
          type: array
        type: array
    type: object
  server.ErrorResponse:
    properties:
      code:
        example: SOMETHING_NOT_FOUND
        type: string
      data:
        additionalProperties: {}
        type: object
      error:
        example: something is missing
        type: string
    type: object
  time.Duration:
    enum:
    - -9223372036854775808
    - 9223372036854775807
    - 1
    - 1000
    - 1000000
    - 1000000000
    - 60000000000
    - 3600000000000
    type: integer
    x-enum-varnames:
    - minDuration
    - maxDuration
    - Nanosecond
    - Microsecond
    - Millisecond
    - Second
    - Minute
    - Hour
info:
  contact:
    name: ice.io
    url: https://ice.io
  description: It is responsible for providing off chain account management for the
    ION Platform; it is the first layer of interaction between users and the platform.
  title: User accounts management for ION
  version: latest
paths:
  /auth/login/init:
    post:
      description: Initiates  login flow
      parameters:
      - description: Request params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.GetLoginChallenge'
      - default: ap-
        description: App ID
        in: header
        name: X-Client-ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.LoginChallenge'
        "400":
          description: if invalid 2FA code is provided
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "403":
          description: if 2FA required
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Login
  /auth/recover/user/delegated:
    post:
      description: Initiates recovery process with delegated RP
      parameters:
      - description: Request params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.StartDelegatedRecoveryReq'
      - default: ap-
        description: App ID
        in: header
        name: X-Client-ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.StartDelegatedRecoveryResp'
        "400":
          description: if invalid 2FA code is provided
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "403":
          description: if 2FA required
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Recovery
  /auth/users/{userId}:
    delete:
      description: Deletes user account
      parameters:
      - description: ID of the user
        in: path
        name: userId
        required: true
        type: string
      - default: Bearer <Add token here>
        description: Auth token from delegated RP
        in: header
        name: Authorization
        required: true
        type: string
      - default: ap-
        description: App ID
        in: header
        name: X-Client-ID
        required: true
        type: string
      - default: <signature>
        description: User's signature
        in: header
        name: X-Useraction
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Found and deleted
        "204":
          description: Already deleted
        "401":
          description: if not authorized
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "403":
          description: not allowed
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Users
  /auth/users/{userIdOrMasterKey}:
    get:
      description: Returns current user state
      parameters:
      - description: ID of the user or his master key (hex)
        in: path
        name: userIdOrMasterKey
        required: true
        type: string
      - default: Bearer <Add token here>
        description: Auth token from delegated RP
        in: header
        name: Authorization
        required: true
        type: string
      - default: ap-
        description: App ID
        in: header
        name: X-Client-ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.User'
        "404":
          description: if user not found
          schema:
            $ref: '#/definitions/main.delegatedErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.delegatedErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Users
  /v1/coins:
    get:
      description: Provides information about all the coins
      parameters:
      - default: bogus
        description: API key
        in: header
        name: X-API-Key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.SymbolGroupWithCoins'
            type: array
        "403":
          description: if invalid X-API-Key provided
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Coins
    post:
      description: Imports information about supported coin
      parameters:
      - default: Bearer <Add token here>
        description: Auth token from delegated relying party
        in: header
        name: Authorization
        required: true
        type: string
      - description: Request params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.ImportCoinReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.Coin'
        "400":
          description: if invalid network provided
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "404":
          description: if no such token exists
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Coins
  /v1/config/{configName}:
    get:
      parameters:
      - description: Name of the configuration to read
        in: path
        name: configName
        required: true
        type: string
      - description: The version of that specific config, if applicable
        in: query
        name: version
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Configuration value
          schema: {}
        "204":
          description: OK, no content, meaning there isn't a newer version of that
            config
        "404":
          description: if invalid configName passed
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Config
  /v1/networks:
    get:
      description: Provides information about all the networks
      parameters:
      - default: bogus
        description: API key
        in: header
        name: X-API-Key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.Network'
            type: array
        "403":
          description: if invalid X-API-Key provided
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: if server fault
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Coins
  /v1/statistics/hashtags:
    get:
      description: Returns top hashtags
      parameters:
      - description: 'Limit for the number of hashtags to return (default: 10)'
        in: query
        name: limit
        type: integer
      - description: Filter hashtags starting with this keyword
        in: query
        name: keyword
        type: string
      - default: Bearer <Add token here>
        description: Auth token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Statistics
    post:
      consumes:
      - application/json
      description: Process hashtags from events
      parameters:
      - description: Events with hashtags
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.HashtagsEventsReq'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
        "400":
          description: if invalid events provided
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Statistics
  /v1/sync-coins:
    patch:
      description: Requests to sync / update coins from 3rdparty
      parameters:
      - collectionFormat: multi
        description: Coins/tokens list to sync
        in: query
        items:
          type: string
        name: symbolGroup
        type: array
      - default: Bearer <Add token here>
        description: Auth token from delegated relying party
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.Coin'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Coins
  /v1/user-social-profiles:
    get:
      consumes:
      - application/json
      description: Searches for users by keyword
      parameters:
      - description: Authorization token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Keyword to search for
        in: query
        name: keyword
        required: true
        type: string
      - description: Maximum number of results
        in: query
        name: limit
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of users matching the search query
          schema:
            items:
              $ref: '#/definitions/accounts.LiteUser'
            type: array
        "400":
          description: Invalid request format
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - SocialProfiles
  /v1/users/{userIdOrMasterKey}/2fa/{twoFAOption}/values/{twoFAOptionValue}:
    delete:
      description: Confirms deletion of 2FA method
      parameters:
      - default: Bearer <token>
        description: Auth header
        in: header
        name: Authorization
        required: true
        type: string
      - description: User signature by master key
        in: header
        name: X-Useraction
        required: true
        type: string
      - description: ID of the user
        in: path
        name: userIdOrMasterKey
        required: true
        type: string
      - description: type of 2fa (sms/email/totp_authenticator)
        in: path
        name: twoFAOption
        required: true
        type: string
      - description: the actual value of the twoFAOption
        in: path
        name: twoFAOptionValue
        required: true
        type: string
      - collectionFormat: multi
        description: the code received via twoFAOptionVerificationValue
        in: query
        items:
          type: string
        name: twoFAOptionVerificationCode
        required: true
        type: array
      - collectionFormat: multi
        description: the provider received the codes
        in: query
        items:
          type: string
        name: twoFAOptionVerificationValue
        required: true
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK - found and deleted
        "204":
          description: OK - no such 2FA
        "400":
          description: Wrong 2FA codes provided
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "403":
          description: No 2FA codes provided to approve removal
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - 2FA
  /v1/users/{userIdOrMasterKey}/2fa/{twoFAOption}/verification-requests:
    patch:
      description: Verifies 2FA code from the user
      parameters:
      - description: ID of the user
        in: path
        name: userIdOrMasterKey
        required: true
        type: string
      - description: type of 2fa (sms/email/totp_authenticator)
        in: path
        name: twoFAOption
        required: true
        type: string
      - description: code from second factor
        in: query
        name: code
        required: true
        type: string
      - default: Bearer <token>
        description: Auth header
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.Verify2FARequestResp'
        "400":
          description: if code is invalid or expired
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "409":
          description: if there is no pending 2FA verification
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - 2FA
    put:
      description: Initiates sending of 2FA code to the user
      parameters:
      - default: en
        description: Language
        in: header
        name: X-Language
        type: string
      - description: User signature by master key
        in: header
        name: X-Useraction
        type: string
      - default: Bearer <token>
        description: Auth header
        in: header
        name: Authorization
        type: string
      - description: ID of the user or username in case of sending codes for recovery
        in: path
        name: userIdOrMasterKey
        required: true
        type: string
      - description: type of 2fa (sms/email/totp_authenticator)
        in: path
        name: twoFAOption
        required: true
        type: string
      - description: Request params containing email or phone number to set up 2FA
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.Send2FARequestReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.Send2FARequestResp'
        "400":
          description: if user's email / phone number is not provided
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "403":
          description: if user already have 2FA set up, and it is requested for new
            email / phone
          schema:
            $ref: '#/definitions/server.ErrorResponse'
