definitions:
  accounts.AvailableCoin:
    properties:
      coin:
        type: string
      network:
        type: string
    type: object
  accounts.CoinAggregation:
    properties:
      totalBalance:
        $ref: '#/definitions/big.Int'
      wallets:
        items:
          $ref: '#/definitions/accounts.CoinInWallet'
        type: array
    type: object
  accounts.CoinInWallet:
    properties:
      asset:
        $ref: '#/definitions/dfns.Asset'
      network:
        type: string
      walletId:
        type: string
    type: object
  accounts.TwoFAOptionEnum:
    enum:
    - sms
    - email
    - totp_authenticator
    type: string
    x-enum-varnames:
    - TwoFAOptionSMS
    - TwoFAOptionEmail
    - TwoFAOptionTOTPAuthenticator
  accounts.WalletViewItem:
    properties:
      coin:
        type: string
      walletId:
        type: string
    type: object
  big.Int:
    type: object
  dfns.Asset:
    additionalProperties: {}
    type: object
  main.Relays:
    properties:
      ionConnectRelays:
        items:
          type: string
        type: array
    type: object
  main.RelaysReq:
    properties:
      followeeList:
        items:
          type: string
        type: array
    type: object
  main.Send2FARequestReq:
    properties:
      2FAVerificationCodes:
        additionalProperties:
          type: string
        type: object
      email:
        type: string
      phoneNumber:
        type: string
    type: object
  main.Send2FARequestResp:
    properties:
      TOTPAuthenticatorURL:
        type: string
    type: object
  main.StartDelegatedRecoveryReq:
    properties:
      2FAVerificationCodes:
        additionalProperties:
          type: string
        type: object
      credentialId:
        type: string
      username:
        type: string
    type: object
  main.StartDelegatedRecoveryResp:
    additionalProperties: {}
    type: object
  main.User:
    properties:
      2faOptions:
        items:
          $ref: '#/definitions/accounts.TwoFAOptionEnum'
        type: array
      email:
        items:
          type: string
        type: array
      ionConnectIndexerRelays:
        items:
          type: string
        type: array
      ionConnectRelays:
        items:
          type: string
        type: array
      phoneNumber:
        items:
          type: string
        type: array
    type: object
  main.Verify2FARequestResp:
    type: object
  main.WalletConfiguration:
    properties:
      availableCoins:
        items:
          $ref: '#/definitions/accounts.AvailableCoin'
        type: array
      version:
        type: integer
    type: object
  main.WalletView:
    properties:
      coins:
        additionalProperties:
          $ref: '#/definitions/accounts.CoinAggregation'
        type: object
      createdAt:
        type: string
      items:
        items:
          $ref: '#/definitions/accounts.WalletViewItem'
        type: array
      name:
        type: string
      updatedAt:
        type: string
      userId:
        type: string
    type: object
  main.WalletViewReq:
    properties:
      items:
        items:
          $ref: '#/definitions/accounts.WalletViewItem'
        type: array
      name:
        type: string
    type: object
  main.delegatedErrorResponse:
    properties:
      data:
        additionalProperties: {}
        type: object
      error:
        $ref: '#/definitions/main.errMessage'
    type: object
  main.errMessage:
    properties:
      message:
        type: string
    type: object
  server.ErrorResponse:
    properties:
      code:
        example: SOMETHING_NOT_FOUND
        type: string
      data:
        additionalProperties: {}
        type: object
      error:
        example: something is missing
        type: string
    type: object
info:
  contact:
    name: ice.io
    url: https://ice.io
  description: It is responsible for providing off chain account management for the
    ION Platform; it is the first layer of interaction between users and the platform.
  title: User accounts management for ION
  version: latest
paths:
  /auth/recover/user/delegated:
    post:
      description: Initiates recovery process with delegated RP
      parameters:
      - description: Request params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.StartDelegatedRecoveryReq'
      - default: ap-
        description: App ID
        in: header
        name: X-Client-ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.StartDelegatedRecoveryResp'
        "400":
          description: if invalid 2FA code is provided
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "403":
          description: if 2FA required
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Recovery
  /auth/users/{userId}:
    get:
      description: Initiates recovery process with delegated relying party
      parameters:
      - description: ID of the user
        in: path
        name: userId
        required: true
        type: string
      - default: Bearer <Add token here>
        description: Auth token from delegated RP
        in: header
        name: Authorization
        required: true
        type: string
      - default: ap-
        description: App ID
        in: header
        name: X-Client-ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.User'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.delegatedErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Users
  /v1/users/{userId}/2fa/{twoFAOption}/values/{twoFAOptionValue}:
    delete:
      description: Confirms deletion of 2FA method
      parameters:
      - default: Bearer <token>
        description: Auth header
        in: header
        name: Authorization
        required: true
        type: string
      - description: User signature by master key
        in: header
        name: X-Useraction
        required: true
        type: string
      - description: ID of the user
        in: path
        name: userId
        required: true
        type: string
      - description: type of 2fa (sms/email/totp_authenticator)
        in: path
        name: twoFAOption
        required: true
        type: string
      - description: the actual value of the twoFAOption
        in: path
        name: twoFAOptionValue
        required: true
        type: string
      - collectionFormat: multi
        description: the code received via twoFAOptionVerificationValue
        in: query
        items:
          type: string
        name: twoFAOptionVerificationCode
        required: true
        type: array
      - collectionFormat: multi
        description: the provider received the codes
        in: query
        items:
          type: string
        name: twoFAOptionVerificationValue
        required: true
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK - found and deleted
        "204":
          description: OK - no such 2FA
        "400":
          description: Wrong 2FA codes provided
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "403":
          description: No 2FA codes provided to approve removal
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - 2FA
  /v1/users/{userId}/2fa/{twoFAOption}/verification-requests:
    patch:
      description: Verifies 2FA code from the user
      parameters:
      - description: ID of the user
        in: path
        name: userId
        required: true
        type: string
      - description: type of 2fa (sms/email/totp_authenticator)
        in: path
        name: twoFAOption
        required: true
        type: string
      - description: code from second factor
        in: query
        name: code
        required: true
        type: string
      - default: Bearer <token>
        description: Auth header
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.Verify2FARequestResp'
        "400":
          description: if code is invalid or expired
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "409":
          description: if there is no pending 2FA verification
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - 2FA
    put:
      description: Initiates sending of 2FA code to the user
      parameters:
      - default: en
        description: Language
        in: header
        name: X-Language
        type: string
      - description: User signature by master key
        in: header
        name: X-Useraction
        type: string
      - default: Bearer <token>
        description: Auth header
        in: header
        name: Authorization
        required: true
        type: string
      - description: ID of the user
        in: path
        name: userId
        required: true
        type: string
      - description: type of 2fa (sms/email/totp_authenticator)
        in: path
        name: twoFAOption
        required: true
        type: string
      - description: Request params containing email or phone number to set up 2FA
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.Send2FARequestReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.Send2FARequestResp'
        "400":
          description: if user's email / phone number is not provided
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "403":
          description: if user already have 2FA set up, and it is requested for new
            email / phone
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - 2FA
  /v1/users/{userId}/ion-connect-indexers:
    get:
      description: Returns indexers list for the user
      parameters:
      - description: ID of the user
        in: path
        name: userId
        required: true
        type: string
      - default: Bearer <Add token here>
        description: Auth token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.Relays'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Users
  /v1/users/{userId}/ion-connect-relays:
    patch:
      description: Assigns relay list for the user based on his followee list
      parameters:
      - description: ID of the user
        in: path
        name: userId
        required: true
        type: string
      - default: Bearer <Add token here>
        description: Auth token from delegated relying party
        in: header
        name: Authorization
        required: true
        type: string
      - description: Request params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.RelaysReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.Relays'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Users
  /v1/users/{userId}/wallet-views:
    get:
      description: Lists all available wallet views for the user
      parameters:
      - description: ID of the user
        in: path
        name: userId
        required: true
        type: string
      - default: Bearer <Add token here>
        description: Auth token from delegated relying party
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.WalletView'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Wallets
    post:
      description: Creates a list of coin / [wallet] for user to see on main wallet
        screen
      parameters:
      - description: ID of the user
        in: path
        name: userId
        required: true
        type: string
      - default: Bearer <Add token here>
        description: Auth token from delegated relying party
        in: header
        name: Authorization
        required: true
        type: string
      - description: Request params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.WalletViewReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.WalletView'
        "400":
          description: if validation of walletview failed
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "409":
          description: if user already owns walletview with such name
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Wallets
  /v1/users/{userId}/wallet-views/{walletViewName}:
    delete:
      description: Deletes wallet view for provided userId and name
      parameters:
      - description: ID of the user
        in: path
        name: userId
        required: true
        type: string
      - description: Name of wallet view
        in: path
        name: walletViewName
        required: true
        type: string
      - default: Bearer <Add token here>
        description: Auth token from delegated relying party
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK - found and deleted
        "204":
          description: No Content - already deleted
        "409":
          description: if trying to delete last wallet view
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Wallets
    get:
      description: Get wallet view with extended information about coins (grouped)
      parameters:
      - description: ID of the user
        in: path
        name: userId
        required: true
        type: string
      - description: Name of wallet view
        in: path
        name: walletViewName
        required: true
        type: string
      - default: Bearer <Add token here>
        description: Auth token from delegated relying party
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.WalletView'
        "404":
          description: if wallet view not found
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Wallets
    put:
      description: Modifies wallet view referenced in url
      parameters:
      - description: ID of the user
        in: path
        name: userId
        required: true
        type: string
      - description: Name of wallet view
        in: path
        name: walletViewName
        required: true
        type: string
      - default: Bearer <Add token here>
        description: Auth token from delegated relying party
        in: header
        name: Authorization
        required: true
        type: string
      - description: Request params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.WalletViewReq'
      produces:
      - application/json
      responses:
        "200":
          description: Modified, updated view in response
          schema:
            $ref: '#/definitions/main.WalletView'
        "404":
          description: if no such view exists
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Wallets
  /v1/wallet-configuration:
    get:
      description: Provides a list of all available coins
      parameters:
      - description: Version of configuration already presented on client
        in: query
        name: known_version
        type: string
      - default: Bearer <Add token here>
        description: Auth token from delegated relying party
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.WalletConfiguration'
        "204":
          description: if known_version have been provided before
          schema:
            $ref: '#/definitions/main.WalletConfiguration'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Wallets
schemes:
- https
swagger: "2.0"
