definitions:
  accounts.CoinMapping:
    properties:
      coinId:
        type: string
      walletId:
        type: string
    type: object
  accounts.TwoFAOptionEnum:
    enum:
    - sms
    - email
    - totp_authenticator
    type: string
    x-enum-varnames:
    - TwoFAOptionSMS
    - TwoFAOptionEmail
    - TwoFAOptionTOTPAuthenticator
  coins.Coin:
    properties:
      iconURL:
        type: string
      id:
        type: string
      name:
        type: string
      network:
        type: string
      priceUSD:
        type: number
      symbol:
        type: string
      symbolGroup:
        type: string
      syncFrequency:
        $ref: '#/definitions/time.Duration'
    type: object
  main.Coin:
    properties:
      iconURL:
        type: string
      id:
        type: string
      name:
        type: string
      network:
        type: string
      priceUSD:
        type: number
      symbol:
        type: string
      symbolGroup:
        type: string
      syncFrequency:
        $ref: '#/definitions/time.Duration'
    type: object
  main.ImportCoinReq:
    properties:
      contractAddress:
        type: string
      network:
        type: string
    type: object
  main.Relays:
    properties:
      ionConnectRelays:
        items:
          type: string
        type: array
    type: object
  main.RelaysReq:
    properties:
      followeeList:
        items:
          type: string
        type: array
    type: object
  main.Send2FARequestReq:
    properties:
      2FAVerificationCodes:
        additionalProperties:
          type: string
        type: object
      email:
        type: string
      phoneNumber:
        type: string
    type: object
  main.Send2FARequestResp:
    properties:
      TOTPAuthenticatorURL:
        type: string
    type: object
  main.StartDelegatedRecoveryReq:
    properties:
      2FAVerificationCodes:
        additionalProperties:
          type: string
        type: object
      credentialId:
        type: string
      username:
        type: string
    type: object
  main.StartDelegatedRecoveryResp:
    additionalProperties: {}
    type: object
  main.User:
    properties:
      2faOptions:
        items:
          $ref: '#/definitions/accounts.TwoFAOptionEnum'
        type: array
      email:
        items:
          type: string
        type: array
      ionConnectIndexerRelays:
        items:
          type: string
        type: array
      ionConnectRelays:
        items:
          type: string
        type: array
      masterPubKey:
        type: string
      phoneNumber:
        items:
          type: string
        type: array
    type: object
  main.Verify2FARequestResp:
    type: object
  main.VersionedCoins:
    properties:
      coins:
        items:
          $ref: '#/definitions/coins.Coin'
        type: array
      version:
        type: integer
    type: object
  main.WalletView:
    properties:
      coins:
        items:
          $ref: '#/definitions/accounts.CoinMapping'
        type: array
      createdAt:
        type: string
      name:
        type: string
      symbolGroups:
        items:
          type: string
        type: array
      updatedAt:
        type: string
      userId:
        type: string
    type: object
  main.WalletViewReq:
    properties:
      items:
        items:
          $ref: '#/definitions/accounts.CoinMapping'
        type: array
      name:
        type: string
      symbolGroups:
        items:
          type: string
        type: array
    type: object
  main.delegatedErrorResponse:
    properties:
      data:
        additionalProperties: {}
        type: object
      error:
        $ref: '#/definitions/main.errMessage'
    type: object
  main.errMessage:
    properties:
      message:
        type: string
    type: object
  server.ErrorResponse:
    properties:
      code:
        example: SOMETHING_NOT_FOUND
        type: string
      data:
        additionalProperties: {}
        type: object
      error:
        example: something is missing
        type: string
    type: object
  time.Duration:
    enum:
    - -9223372036854775808
    - 9223372036854775807
    - 1
    - 1000
    - 1000000
    - 1000000000
    - 60000000000
    - 3600000000000
    type: integer
    x-enum-varnames:
    - minDuration
    - maxDuration
    - Nanosecond
    - Microsecond
    - Millisecond
    - Second
    - Minute
    - Hour
info:
  contact:
    name: ice.io
    url: https://ice.io
  description: It is responsible for providing off chain account management for the
    ION Platform; it is the first layer of interaction between users and the platform.
  title: User accounts management for ION
  version: latest
paths:
  /auth/recover/user/delegated:
    post:
      description: Initiates recovery process with delegated RP
      parameters:
      - description: Request params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.StartDelegatedRecoveryReq'
      - default: ap-
        description: App ID
        in: header
        name: X-Client-ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.StartDelegatedRecoveryResp'
        "400":
          description: if invalid 2FA code is provided
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "403":
          description: if 2FA required
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Recovery
  /auth/users/{userIdOrMasterKey}:
    get:
      description: Initiates recovery process with delegated relying party
      parameters:
      - description: ID of the user or his master key (hex)
        in: path
        name: userIdOrMasterKey
        required: true
        type: string
      - default: Bearer <Add token here>
        description: Auth token from delegated RP
        in: header
        name: Authorization
        required: true
        type: string
      - default: ap-
        description: App ID
        in: header
        name: X-Client-ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.User'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/main.delegatedErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Users
  /v1/coins:
    post:
      description: Imports information about supported coin
      parameters:
      - default: Bearer <Add token here>
        description: Auth token from delegated relying party
        in: header
        name: Authorization
        required: true
        type: string
      - description: Request params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.ImportCoinReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.Coin'
        "400":
          description: if invalid network provided
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "404":
          description: if no such token exists
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Coins
  /v1/sync-coins:
    patch:
      description: Requests to sync / update coins from 3rdparty
      parameters:
      - collectionFormat: multi
        description: Coins/tokens list to sync
        in: query
        items:
          type: string
        name: symbolGroup
        type: array
      - default: Bearer <Add token here>
        description: Auth token from delegated relying party
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.Coin'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Coins
  /v1/users/:userId/coins/:symbolGroup:
    get:
      description: Returns all the user coins with symbol and wallet info (balances,
        etc)
      parameters:
      - description: symbolGroup to filter
        in: path
        name: symbolGroup
        type: string
      - description: ID of the user
        in: path
        name: userId
        type: string
      - default: Bearer <Add token here>
        description: Auth token from delegated relying party
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.Coin'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Coins
  /v1/users/{userID}/coins:
    get:
      description: Provides a list of coins updated since version
      parameters:
      - description: Version of configuration already presented on client
        in: query
        name: version
        type: string
      - default: Bearer <Add token here>
        description: Auth token from delegated relying party
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.VersionedCoins'
        "204":
          description: if known_version have been provided before
          schema:
            $ref: '#/definitions/main.VersionedCoins'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Coins
  /v1/users/{userId}/2fa/{twoFAOption}/values/{twoFAOptionValue}:
    delete:
      description: Confirms deletion of 2FA method
      parameters:
      - default: Bearer <token>
        description: Auth header
        in: header
        name: Authorization
        required: true
        type: string
      - description: User signature by master key
        in: header
        name: X-Useraction
        required: true
        type: string
      - description: ID of the user
        in: path
        name: userId
        required: true
        type: string
      - description: type of 2fa (sms/email/totp_authenticator)
        in: path
        name: twoFAOption
        required: true
        type: string
      - description: the actual value of the twoFAOption
        in: path
        name: twoFAOptionValue
        required: true
        type: string
      - collectionFormat: multi
        description: the code received via twoFAOptionVerificationValue
        in: query
        items:
          type: string
        name: twoFAOptionVerificationCode
        required: true
        type: array
      - collectionFormat: multi
        description: the provider received the codes
        in: query
        items:
          type: string
        name: twoFAOptionVerificationValue
        required: true
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK - found and deleted
        "204":
          description: OK - no such 2FA
        "400":
          description: Wrong 2FA codes provided
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "403":
          description: No 2FA codes provided to approve removal
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - 2FA
  /v1/users/{userId}/2fa/{twoFAOption}/verification-requests:
    patch:
      description: Verifies 2FA code from the user
      parameters:
      - description: ID of the user
        in: path
        name: userId
        required: true
        type: string
      - description: type of 2fa (sms/email/totp_authenticator)
        in: path
        name: twoFAOption
        required: true
        type: string
      - description: code from second factor
        in: query
        name: code
        required: true
        type: string
      - default: Bearer <token>
        description: Auth header
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.Verify2FARequestResp'
        "400":
          description: if code is invalid or expired
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "409":
          description: if there is no pending 2FA verification
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - 2FA
    put:
      description: Initiates sending of 2FA code to the user
      parameters:
      - default: en
        description: Language
        in: header
        name: X-Language
        type: string
      - description: User signature by master key
        in: header
        name: X-Useraction
        type: string
      - default: Bearer <token>
        description: Auth header
        in: header
        name: Authorization
        type: string
      - description: ID of the user or username in case of sending codes for recovery
        in: path
        name: userId
        required: true
        type: string
      - description: type of 2fa (sms/email/totp_authenticator)
        in: path
        name: twoFAOption
        required: true
        type: string
      - description: Request params containing email or phone number to set up 2FA
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.Send2FARequestReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.Send2FARequestResp'
        "400":
          description: if user's email / phone number is not provided
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "403":
          description: if user already have 2FA set up, and it is requested for new
            email / phone
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - 2FA
  /v1/users/{userId}/ion-connect-indexers:
    get:
      description: Returns indexers list for the user
      parameters:
      - description: ID of the user
        in: path
        name: userId
        required: true
        type: string
      - default: Bearer <Add token here>
        description: Auth token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.Relays'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Users
  /v1/users/{userId}/ion-connect-relays:
    patch:
      description: Assigns relay list for the user based on his followee list
      parameters:
      - description: ID of the user
        in: path
        name: userId
        required: true
        type: string
      - default: Bearer <Add token here>
        description: Auth token from delegated relying party
        in: header
        name: Authorization
        required: true
        type: string
      - description: Request params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.RelaysReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.Relays'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Users
  /v1/users/{userId}/wallet-views:
    get:
      description: Lists all available wallet views for the user
      parameters:
      - description: ID of the user
        in: path
        name: userId
        required: true
        type: string
      - default: Bearer <Add token here>
        description: Auth token from delegated relying party
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/main.WalletView'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Wallets
    post:
      description: Creates a list of coin / [wallet] for user to see on main wallet
        screen
      parameters:
      - description: ID of the user
        in: path
        name: userId
        required: true
        type: string
      - default: Bearer <Add token here>
        description: Auth token from delegated relying party
        in: header
        name: Authorization
        required: true
        type: string
      - description: Request params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.WalletViewReq'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/main.WalletView'
        "400":
          description: if validation of walletview failed
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "409":
          description: if user already owns walletview with such name
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Wallets
  /v1/users/{userId}/wallet-views/{walletViewName}:
    delete:
      description: Deletes wallet view for provided userId and name
      parameters:
      - description: ID of the user
        in: path
        name: userId
        required: true
        type: string
      - description: Name of wallet view
        in: path
        name: walletViewName
        required: true
        type: string
      - default: Bearer <Add token here>
        description: Auth token from delegated relying party
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK - found and deleted
        "204":
          description: No Content - already deleted
        "409":
          description: if trying to delete last wallet view
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Wallets
    put:
      description: Modifies wallet view referenced in url
      parameters:
      - description: ID of the user
        in: path
        name: userId
        required: true
        type: string
      - description: Name of wallet view
        in: path
        name: walletViewName
        required: true
        type: string
      - default: Bearer <Add token here>
        description: Auth token from delegated relying party
        in: header
        name: Authorization
        required: true
        type: string
      - description: Request params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.WalletViewReq'
      produces:
      - application/json
      responses:
        "200":
          description: Modified, updated view in response
          schema:
            $ref: '#/definitions/main.WalletView'
        "404":
          description: if no such view exists
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Wallets
  /wallets/:walletId/nfts:
    get:
      description: Gets NFTs from the wallet
      parameters:
      - description: Request params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/main.StartDelegatedRecoveryReq'
      - default: ap-
        description: App ID
        in: header
        name: X-Client-ID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.StartDelegatedRecoveryResp'
        "400":
          description: if invalid 2FA code is provided
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "403":
          description: if 2FA required
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.ErrorResponse'
        "504":
          description: if request times out
          schema:
            $ref: '#/definitions/server.ErrorResponse'
      tags:
      - Wallets
schemes:
- https
swagger: "2.0"
