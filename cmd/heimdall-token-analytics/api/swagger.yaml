  /v1/community-tokens/{externalAddressOrViewType}/viewing-sessions:
    post:
      description: Creates a new session view for community tokens analytics.
      parameters:
      - description: View type
        enum:
        - top
        - trending
        - bondingCurveProgress
        example: '"top"'
        in: path
