      base64-encoded event.
    in: header
    name: Authorization
    type: apiKey
  XCom:
    description: 'Type "X.com" followed by a space and base64-encoded JSON with user
      info: {"userId":"...","userHandle":"...","displayName":"...","verified":true}'
    in: header
    name: Authorization
    type: apiKey
